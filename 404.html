<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found &mdash; Vanny De Leon</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .nf {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .nf__code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 22vw, 12rem);
      line-height: .9;
      background: var(--grad-text);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-right: .14em;
      margin-right: -.14em;
    }
    .nf h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      margin: .75rem 0 .5rem;
      color: var(--text);
    }
    .nf p { color: var(--text-muted); max-width: 30rem; margin: 0 auto 2rem; }
    .nf__actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="grid-lines" aria-hidden="true"></div>
    <div class="container">
      <p class="nf__code">404</p>
      <h1>This page took a wrong turn</h1>
      <p>The link is broken or the page has moved. Everything worth seeing is back on the home page.</p>
      <div class="nf__actions">
        <a href="/" class="btn btn--primary">Back to Home</a>
        <a href="/#work" class="btn btn--ghost">See My Work</a>
      </div>
    </div>
  </main>
</body>
</html>
